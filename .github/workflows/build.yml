name: Build Kayoko

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scheme:
        description: Package scheme
        type: choice
        options: [rootless, roothide]
        default: roothide

permissions:
  contents: write

concurrency:
  group: kayoko-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      THEOS: ${{ github.workspace }}/.theos-ci
      THEOS_PACKAGE_SCHEME: ${{ github.event_name == 'workflow_dispatch' && inputs.scheme || 'roothide' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and install host tools
        run: |
          xcode-select -p
          xcrun --find clang
          brew install dpkg ldid

      - name: Check dictation activation callbacks
        run: |
          xcrun clang -fobjc-arc -framework Foundation -framework CoreFoundation ci/DictationActivationTests.m -o "$RUNNER_TEMP/kayoko-dictation-tests"
          "$RUNNER_TEMP/kayoko-dictation-tests"

      - name: Check tap-outside-to-dismiss geometry
        run: |
          xcrun clang -fobjc-arc -framework Foundation -framework CoreGraphics ci/TapOutsideTests.m -o "$RUNNER_TEMP/kayoko-tapoutside-tests"
          "$RUNNER_TEMP/kayoko-tapoutside-tests"

      - name: Check bounded clipboard executor
        timeout-minutes: 2
        run: |
          xcrun clang -fobjc-arc -framework Foundation ci/ClipboardExecutorTests.m Manager/KayokoClipboardExecutor.m -o "$RUNNER_TEMP/kayoko-executor-tests"
          "$RUNNER_TEMP/kayoko-executor-tests"

      - name: Check asynchronous history store
        timeout-minutes: 2
        run: |
          xcrun clang -fobjc-arc -framework Foundation ci/HistoryStoreTests.m Manager/KayokoHistoryStore.m -o "$RUNNER_TEMP/kayoko-history-tests"
          "$RUNNER_TEMP/kayoko-history-tests"

      - name: Check manager with stalled clipboard provider
        timeout-minutes: 2
        run: |
          xcrun clang -fobjc-arc -Ici/stubs -framework Foundation -framework CoreGraphics ci/ClipboardManagerTests.m Manager/PasteboardManager.m Manager/PasteboardItem.m Manager/KayokoHistoryStore.m Manager/KayokoClipboardExecutor.m -o "$RUNNER_TEMP/kayoko-manager-tests"
          "$RUNNER_TEMP/kayoko-manager-tests"

      - name: Bump Package Version
        id: bump
        run: |
          VERSION="${{ github.run_number }}"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fetch Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$THEOS_PACKAGE_SCHEME" == roothide ]]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules \
              https://github.com/roothide/theos.git "$THEOS"
          else
            git clone --depth 1 --recurse-submodules --shallow-submodules \
              https://github.com/theos/theos.git "$THEOS"
          fi
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -a "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"

      - name: Prepare libSandy link interface
        run: python3 ci/prepare_sandy.py

      - name: Build Package
        shell: bash
        run: |
          set -euo pipefail
          sh build.sh "$THEOS_PACKAGE_SCHEME"
          find ./packages -name "*.deb" -type f

      - name: Check lean package composition
        run: python3 ci/CheckLeanPackage.py ./packages/*.deb

      - name: Check arm64e-only package and details
        run: python3 ci/CheckArm64eOnly.py ./packages/*.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.THEOS_PACKAGE_SCHEME }}
          path: ./packages/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Create Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: "Kayoko v${{ steps.bump.outputs.package_version }}"
          files: ./packages/*.deb
